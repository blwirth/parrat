name: C# Release

on:
  push:
    tags: ['v*-csharp']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/Parat.UI/Parat.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Bundle release zip
        shell: pwsh
        run: |
          $out = "release/parat"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item publish/Parat.UI.exe $out/
          Copy-Item -Recurse data $out/data
          New-Item -ItemType Directory -Path "$out/config" -Force | Out-Null
          New-Item -ItemType Directory -Path "$out/logs" -Force | Out-Null
          Compress-Archive -Path "$out/*" -DestinationPath "release/Parat-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Parat-win-x64.zip
          generate_release_notes: true
