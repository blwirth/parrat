name: C# Tests

on:
  push:
    branches: [csharp-preview]
    paths: ['src/**']
  pull_request:
    branches: [csharp-preview]
    paths: ['src/**']

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/Parat.sln --configuration Release

      - name: Test
        run: dotnet test src/Parat.Tests/
