name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Ruby (for asciidoctor-pdf)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install asciidoctor-pdf
        run: gem install asciidoctor-pdf

      - name: Build user manual PDF
        run: |
          cd docs
          asciidoctor-pdf "PARRAT - User Manual.adoc" -o "PARRAT - User Manual.pdf"

      - name: Publish
        run: >
          dotnet publish src/Parrat.UI/Parrat.UI.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Bundle release zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $out = "release/parrat"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          New-Item -ItemType Directory -Path "$out/docs" -Force | Out-Null
          New-Item -ItemType Directory -Path "$out/config" -Force | Out-Null
          New-Item -ItemType Directory -Path "$out/logs" -Force | Out-Null

          Copy-Item publish/PARRAT.exe $out/
          Copy-Item -Recurse data $out/data
          Copy-Item "docs/PARRAT - User Manual.pdf" "$out/docs/"

          # Write version file (read by app for window title)
          $tag | Out-File -FilePath "$out/VERSION" -Encoding utf8 -NoNewline

          Compress-Archive -Path "$out/*" -DestinationPath "release/PARRAT-${tag}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/PARRAT-*.zip
          generate_release_notes: true
          name: "PARRAT ${{ github.ref_name }}"
