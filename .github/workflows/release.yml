name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-cs'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results.Count -gt 0) {
            $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) violation(s)"
            exit 1
          }
          Write-Host "PSScriptAnalyzer: 0 violations"

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install asciidoctor-pdf
        run: sudo gem install asciidoctor-pdf

      - name: Build user manual PDF
        run: |
          cd docs
          asciidoctor-pdf "PARAT - User Manual.adoc" -o "PARAT - User Manual.pdf"

      - name: Build release zip
        run: |
          mkdir -p staging/docs staging/button-handlers staging/lib staging/ui staging/config staging/data staging/logo

          cp parat.ps1 Run.bat staging/
          cp -r button-handlers/*.ps1 staging/button-handlers/
          cp -r lib/*.ps1 staging/lib/
          cp -r ui/*.ps1 staging/ui/
          cp -r config/* staging/config/
          cp -r data/* staging/data/
          cp -r logo/* staging/logo/
          cp "docs/PARAT - User Manual.pdf" staging/docs/

          echo "${{ github.ref_name }}" > staging/VERSION

          TAG="${{ github.ref_name }}"
          SAFE_TAG="${TAG//./_}"
          cd staging && zip -r ../PARAT-${SAFE_TAG}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PARAT-*.zip
          generate_release_notes: true
